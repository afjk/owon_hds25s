[package]
name = "owon-scope"
version = "0.4.1"
edition = "2021"
rust-version = "1.90"
default-run = "owon-scope"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
owon-core = { path = "../crates/owon-core" }
image = { version = "0.25.8", default-features = false, features = ["png", "bmp", "gif"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = "0.3.2"
objc2-app-kit = "0.3.2"
objc2-web-kit = "0.3.2"

[profile.release]
lto = "thin"
strip = true
